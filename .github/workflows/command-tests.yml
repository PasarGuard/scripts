name: Unit Tests

permissions:
  contents: read

on:
  push:
    paths:
      - ".github/workflows/command-tests.yml"
      - "pasarguard.sh"
      - "pg-node.sh"
      - "pg-node-service.sh"
      - "iran-sanction/**"
      - "lib/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/command-tests.yml"
      - "pasarguard.sh"
      - "pg-node.sh"
      - "pg-node-service.sh"
      - "iran-sanction/**"
      - "lib/**"
      - "tests/**"
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install archive tooling for restore-safety tests
        run: sudo apt-get update && sudo apt-get install -y zip unzip
      - name: Run all unit tests
        run: bash tests/run_all.sh
