name: Backup Restore

permissions:
  contents: read

on:
  push:
    paths:
      - ".github/workflows/backup-restore.yml"
      - "lib/pasarguard-backup.sh"
      - "lib/pasarguard-restore.sh"
      - "lib/common.sh"
      - "lib/docker.sh"
      - "lib/env.sh"
      - "lib/system.sh"
      - "pasarguard.sh"
      - "tests/backup_restore_roundtrip.sh"
      - "tests/fresh_recovery_roundtrip.sh"
      - "tests/unit_pasarguard.sh"
  pull_request:
    paths:
      - ".github/workflows/backup-restore.yml"
      - "lib/pasarguard-backup.sh"
      - "lib/pasarguard-restore.sh"
      - "lib/common.sh"
      - "lib/docker.sh"
      - "lib/env.sh"
      - "lib/system.sh"
      - "pasarguard.sh"
      - "tests/backup_restore_roundtrip.sh"
      - "tests/fresh_recovery_roundtrip.sh"
      - "tests/unit_pasarguard.sh"
  workflow_dispatch:

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database:
          - sqlite
          - mysql
          - mariadb
          - postgresql
          - timescaledb
        archive_mode:
          - single
          - multipart

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync zip unzip sqlite3

      - name: Run backup/restore round-trip
        run: bash tests/backup_restore_roundtrip.sh "${{ matrix.database }}" "${{ matrix.archive_mode }}"

  timescaledb-version-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync zip unzip sqlite3

      - name: Restore TimescaleDB 2.27 backup into 2.28 destination
        env:
          TIMESCALE_SOURCE_IMAGE: timescale/timescaledb:2.27.2-pg17
          TIMESCALE_TARGET_IMAGE: timescale/timescaledb:2.28.3-pg17
          TIMESCALEDB_COMPAT_IMAGE: timescale/timescaledb-ha:pg17-ts2.28-all
        run: bash tests/backup_restore_roundtrip.sh timescaledb single

  fresh-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database:
          - sqlite
          - mysql
          - mariadb
          - postgresql
          - timescaledb
        healthcheck:
          - healthcheck
        include:
          - database: mysql
            healthcheck: no-healthcheck
          - database: mariadb
            healthcheck: no-healthcheck
          - database: postgresql
            healthcheck: no-healthcheck
          - database: postgresql
            healthcheck: failing-healthcheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync zip unzip sqlite3 jq

      # Removes the source installation and its images, so --fresh has to pull
      # the recorded digests and recreate the Compose image names.
      - name: Recover a removed installation with restore --fresh
        env:
          FRESH_PULL_IMAGES: "true"
        run: sudo -E bash tests/fresh_recovery_roundtrip.sh "${{ matrix.database }}" "${{ matrix.healthcheck }}"
